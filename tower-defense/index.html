  burst(tw.x, tw.y, 16, ['#ffd25a', '#9a8a6a'], { min: 40, max: 140 });
  tw.pad.tower = null; G.towers.splice(G.towers.indexOf(tw), 1);
  if (G.sel === tw) G.sel = null;
  refreshAll();
}

/* ---------------- 索敌 ---------------- */
function pick(tw, rng, minR) {
  let best = null, bv = 0;
  for (const e of G.enemies) {
    if (e.dead) continue;
    const dd = Math.hypot(e.x - tw.x, e.y - tw.y);
    if (dd > rng + e.r * 0.4 || dd < (minR || 0)) continue;
    let v;
    switch (tw.mode) {
      case 'first': v = e.d; break;
      case 'strong': v = e.hp + e.shield; break;
      case 'weak': v = -(e.hp + e.shield); break;
      default: v = -dd;
    }
    if (!best || v > bv) { best = e; bv = v; }
  }
  return best;
}
const turn = (a, b, mx) => { const d = angDiff(a, b); return Math.abs(d) <= mx ? b : a + Math.sign(d) * mx; };

/* ---------------- 防御塔逻辑 ---------------- */
function updTowers(dt) {
  const over = G.skills.over.active > 0, sp = over ? 1.5 : 1;
  for (const tw of G.towers) {
    tw.t += dt; tw.rec = Math.max(0, tw.rec - dt * 7); tw.cool -= dt * sp;
    const d = TD[tw.type], rng = d.rng[tw.lvl], lv = tw.lvl;
    if (tw.type === 'frost') {
      tw.pulse = Math.max(0, tw.pulse - dt * 3);
      if (tw.cool <= 0 && G.enemies.some(e => !e.dead && Math.hypot(e.x - tw.x, e.y - tw.y) <= rng + e.r * .4)) frostPulse(tw, rng);
      continue;
    }
    const tg = pick(tw, rng, tw.type === 'mortar' ? 60 : 0);
    tw.tg = tg;
    if (!tg) { tw.beam = null; continue; }
    if (tw.type === 'arrow') {
      tw.ang = turn(tw.ang, Math.atan2(tg.y - tw.y, tg.x - tw.x), dt * 10);
      if (tw.cool <= 0 && Math.abs(angDiff(tw.ang, Math.atan2(tg.y - tw.y, tg.x - tw.x))) < 0.3) {
        tw.cool = d.rate[lv]; tw.rec = 1; tw.side *= -1;
        const nx = -Math.sin(tw.ang), ny = Math.cos(tw.ang);
        G.bullets.push({ x: tw.x + Math.cos(tw.ang) * 24 + nx * 5 * tw.side, y: tw.y + Math.sin(tw.ang) * 24 + ny * 5 * tw.side, tgt: tg, lx: tg.x, ly: tg.y, src: tw, lvl: lv, trail: [] });
        sfx('shoot');
      }
    } else if (tw.type === 'arcane') {
      tw.ang = turn(tw.ang, Math.atan2(tg.y - tw.y, tg.x - tw.x), dt * 9);
      if (lv === 0) {
        tw.beam = tg;
        const a = 28 * dt * sp;
        dealDmg(tg, a, 'true', tw, { quiet: true });
        tw.accD += a; tw.accT += dt;
        if (tw.accT >= 0.5) { if (!tg.dead || true) addText(tg.x + rnd(-6, 6), tg.y - tg.r - 8, String(Math.round(tw.accD)), '#c28bff', 14); tw.accT = 0; tw.accD = 0; }
        sfx('beam');
      } else if (tw.cool <= 0) {
        tw.cool = d.rate[lv]; tw.rec = 1;
        const hit = [tg]; let last = tg;
        const maxN = lv === 1 ? 2 : 3;
        while (hit.length < maxN) {
          let nb = null, nd = 125;
          for (const e of G.enemies) { if (e.dead || hit.includes(e)) continue; const dd = dist(e, last); if (dd < nd) { nd = dd; nb = e; } }
          if (!nb) break; hit.push(nb); last = nb;
        }
        let px = tw.x + Math.cos(tw.ang) * 18, py = tw.y + Math.sin(tw.ang) * 18 - 10;
        const segs = [];
        hit.forEach(e => { segs.push([px, py, e.x, e.y]); px = e.x; py = e.y; });
        G.bolts.push({ segs, t: 0, life: 0.2 });
        hit.forEach(e => { dealDmg(e, d.dmg[lv], 'true', tw); burst(e.x, e.y, 5, ['#c28bff', '#7ff0ff'], { min: 30, max: 110 }); });
        sfx('laser');
      }
    } else if (tw.type === 'mortar') {
      const T = 1.0;
      const pe = tg.stunT > 0 ? posAt(tg.d) : posAt(tg.d + tg.spdNow * T);
      tw.ang = turn(tw.ang, Math.atan2(pe.y - tw.y, pe.x - tw.x), dt * 6);
      if (tw.cool <= 0 && Math.abs(angDiff(tw.ang, Math.atan2(pe.y - tw.y, pe.x - tw.x))) < 0.25) {
        tw.cool = d.rate[lv]; tw.rec = 1;
        const crit = Math.random() < 0.08;
        G.shells.push({ sx: tw.x + Math.cos(tw.ang) * 24, sy: tw.y + Math.sin(tw.ang) * 24, tx: pe.x, ty: pe.y, t: 0, T, src: tw, lvl: lv, crit });
        burst(tw.x + Math.cos(tw.ang) * 28, tw.y + Math.sin(tw.ang) * 28, 6, ['#ffd25a', '#aaaaaa', '#ffffff'], { min: 20, max: 80, g: -20 });
        sfx('mortar');
      }
    }
  }
}
function frostPulse(tw, rng) {
  const lv = tw.lvl, d = TD.frost;
  tw.cool = d.rate[lv]; tw.pulse = 1; sfx('frost');
  G.fx.push({ k: 'frost', x: tw.x, y: tw.y, t: 0, life: 0.6, r: rng });
  for (const e of G.enemies) {
    if (e.dead || Math.hypot(e.x - tw.x, e.y - tw.y) > rng + e.r * .4) continue;
    applySlow(e, 0.6, 2.5);
    if (lv === 2) {
      e.vulnT = 3;
      if (Math.random() < 0.2 && applyStun(e, 1.1)) addText(e.x, e.y - e.r - 20, S_('frozen'), '#9fe3ff', 15);
    }
    burst(e.x, e.y, 3, ['#bfe9ff', '#ffffff'], { min: 20, max: 70 });

}

/* ---------------- 子弹 / 炮弹 / 陨石 ---------------- */
function updBullets(dt) {
  for (const b of G.bullets) {
    if (b.tgt && !b.tgt.dead) { b.lx = b.tgt.x; b.ly = b.tgt.y; }
    const dx = b.lx - b.x, dy = b.ly - b.y, dd = Math.hypot(dx, dy), step = 820 * dt;
    b.trail.push([b.x, b.y]); if (b.trail.length > (b.lvl === 2 ? 9 : 4)) b.trail.shift();
    if (dd <= step + 6) {
      b.dead = true;
      const e = b.tgt;
      if (e && !e.dead) {
        const src = b.src; let mult = 1;
        if (b.lvl === 2) {
          if (src.streakId === e.id) src.streak = Math.min(5, src.streak + 1); else { src.streakId = e.id; src.streak = 0; }
          mult = 1 + 0.15 * src.streak;
        }
        const crit = Math.random() < 0.08;
        dealDmg(e, TD.arrow.dmg[b.lvl] * mult * (crit ? 2 : 1), 'phys', src, { crit, pierce: b.lvl === 2 ? 0.5 : 0 });
        burst(e.x, e.y, 3, ['#ffd25a', '#ffffff'], { min: 20, max: 80, g: 0 }); sfx('hit');
      }
    } else { b.x += dx / dd * step; b.y += dy / dd * step; }
  }
  G.bullets = G.bullets.filter(b => !b.dead);

  for (const s of G.shells) {
    s.t += dt;
    if (s.t >= s.T) {
      s.dead = true;
      const d = TD.mortar, lv = s.lvl, rad = d.rad[lv];
      G.fx.push({ k: 'ring', x: s.tx, y: s.ty, t: 0, life: 0.5, r: rad, color: '255,170,60' });
      G.fx.push({ k: 'flash', x: s.tx, y: s.ty, t: 0, life: 0.3, r: rad });
      G.scorches.push({ x: s.tx, y: s.ty, r: rad * 0.7, t: 0, life: 14 });
      burst(s.tx, s.ty, 18, ['#ffb03a', '#ff6a2a', '#3a3a3a'], { min: 40, max: 170, g: 120, s0: 2, s1: 6 });
      shake(3); sfx('boom');
      for (const e of G.enemies) {
        if (e.dead) continue;
        const dd = Math.hypot(e.x - s.tx, e.y - s.ty);
        if (dd <= rad + e.r * 0.5) dealDmg(e, d.dmg[lv] * (1 - 0.4 * clamp(dd / rad, 0, 1)) * (s.crit ? 1.8 : 1), 'siege', s.src, { crit: s.crit });
      }
      if (lv === 2) G.fires.push({ x: s.tx, y: s.ty, r: rad * 0.85, t: 0, life: 4, tick: 0, src: s.src });
    }
  }
  G.shells = G.shells.filter(s => !s.dead);

  for (const f of G.fires) {
    f.t += dt; f.tick += dt;
    if (f.tick >= 0.5) {
      f.tick = 0;
      for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - f.x, e.y - f.y) <= f.r + e.r * .4) dealDmg(e, 10, 'fire', f.src);
    }
  }
  G.fires = G.fires.filter(f => f.t < f.life);

  for (const m of G.meteors) {
    m.t += dt;
    if (!m.hit && m.t >= m.delay + m.T) {
      m.hit = true;
      G.fx.push({ k: 'ring', x: m.x, y: m.y, t: 0, life: 0.7, r: 100, color: '255,110,50' });
      G.fx.push({ k: 'flash', x: m.x, y: m.y, t: 0, life: 0.45, r: 110 });
      G.scorches.push({ x: m.x, y: m.y, r: 60, t: 0, life: 18 });
      burst(m.x, m.y, 40, ['#ffb03a', '#ff5a2a', '#ffe08a', '#3a2a2a'], { min: 60, max: 300, g: 160, s0: 2, s1: 7 });
      shake(11); sfx('boom');
      for (const e of G.enemies) {
        if (e.dead) continue;
        const dd = Math.hypot(e.x - m.x, e.y - m.y);
        if (dd <= 96 + e.r * .5) {
          dealDmg(e, 240 * (1 - 0.3 * dd / 96), 'true', null, {});
          if (!applyStun(e, 1.3)) applySlow(e, 0.5, 2);
        }
      }
    }
  }
  G.meteors = G.meteors.filter(m => !m.hit);
}

/* ---------------- 敌人更新 ---------------- */
function updEnemies(dt) {
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slowM = 1; }
    if (e.vulnT > 0) e.vulnT -= dt;
    if (e.stunT > 0) e.stunT -= dt;
    const eff = e.stunT > 0 ? 0 : (e.slowT > 0 ? e.slowM : 1);
    e.spdNow = e.def.spd * eff;
    e.d += e.spdNow * dt;
    const p = posAt(e.d); e.x = p.x; e.y = p.y;
    if (Math.abs(p.dx) > 0.3) e.face = p.dx > 0 ? 1 : -1;
    if (e.type === 'shaman') {
      e.healT -= dt;
      if (e.healT <= 0) {
        e.healT = 4;
        G.fx.push({ k: 'heal', x: e.x, y: e.y, t: 0, life: 0.7, r: 120 });
        sfx('heal');
        for (const o of G.enemies) {
          if (o.dead || o === e || dist(o, e) > 120 || o.hp >= o.max) continue;
          const h = Math.min(o.max - o.hp, o.max * 0.15); o.hp += h;
          addText(o.x, o.y - o.r - 8, '+' + Math.round(h), '#6bff9a', 13);
        }
      }
    }
    if (e.d >= TOTAL) {
      e.dead = true; e.leaked = true;
      G.lives = Math.max(0, G.lives - e.def.leak); G.leakFlash = 0.5; shake(6 + e.def.leak); sfx('leak');
      addText(CRYSTAL.x + 40, CRYSTAL.y - 40, '-' + e.def.leak, '#ff6b6b', 26);
      burst(CRYSTAL.x, CRYSTAL.y, 14, ['#7fd0ff', '#ffffff'], { min: 40, max: 160 });
      refreshHud();
      if (G.lives <= 0 && G.state === 'play') endGame(false);
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
}

/* ---------------- 波次 ---------------- */
function waveInfo(w) {
  const spec = WV[w - 1]; if (!spec) return '';
  return Object.entries(spec).map(([k, n]) => `${EMO[k]} ${EN[k].name} ×${n}`).join('<br>');
}
let nwWave = 0;
function setNextWave(w) {
  nwWave = w;
  $('nextWave').innerHTML = w < 15 ? `<b>${S_(w === 0 ? 'nwFirst' : 'nwNext') && SF_(w === 0 ? 'nwFirst' : 'nwNext', w + 1)}</b><br>${waveInfo(w + 1)}` : `<b>${S_('nwFinal')}</b>`;
}
function launchWave(early) {
  if (G.wave >= 15 || G.spawning) return;
  if (early) {
    const bonus = Math.round(G.countdown * 1.5);
    if (bonus > 0) { G.gold += bonus; goldUp(); G.texts.push({ x: 640, y: 80, txt: SF_('earlyPlus', bonus), color: '#ffd25a', size: 22, t: 0, life: 1.4, vy: -20 }); sfx('coin'); }
  }
  G.wave++;
  const w = G.wave, spec = WV[w - 1], list = [];
  for (const [k, n] of Object.entries(spec)) for (let i = 0; i < n; i++) list.push(k);
  for (let i = list.length - 1; i > 0; i--) { const j = rint(0, i); [list[i], list[j]] = [list[j], list[i]]; }
  const bi = list.indexOf('boss'); if (bi > 0) { list.splice(bi, 1); list.unshift('boss'); }
  const iv = list.length > 40 ? 0.62 : 0.8;
  list.forEach((t, i) => G.queue.push({ t: G.time + i * iv * (t === 'hound' ? .8 : 1) + (t === 'boss' ? 0 : (bi >= 0 ? 3 : 0)), type: t, wave: w }));
  G.queue.sort((a, b) => a.t - b.t);
  G.spawning = true; G.paid = false;
  if (spec.boss) { G.banner = { txt: S_('bnBoss'), sub: SF_('bnBossSub', w), t: 3.2, color: '#ff5a4a', big: true }; sfx('alarm'); shake(6); }
  else G.banner = { txt: SF_('bnWave', w), t: 1.6, color: '#e7ecf6' };
  setNextWave(w);
  refreshHud();
}

/* ---------------- 主更新 ---------------- */
function step(dt) {
  G.time += dt;
  if (G.leakFlash > 0) G.leakFlash -= dt;
  if (G.banner && (G.banner.t -= dt) <= 0) G.banner = null;
  const sk = G.skills;
  if (sk.meteor.cd > 0) sk.meteor.cd -= dt;
  if (sk.over.cd > 0) sk.over.cd -= dt;
  if (sk.over.active > 0) sk.over.active -= dt;

  while (G.queue.length && G.queue[0].t <= G.time) { const q = G.queue.shift(); spawnEnemy(q.type, 0, q.wave); }
  if (G.spawning && G.queue.length === 0) { G.spawning = false; G.countdown = G.wave < 15 ? GAP : 0; }
  if (!G.spawning && G.countdown > 0 && G.wave < 15) G.countdown = Math.max(0, G.countdown - dt);
  if (G.autoNext && !G.spawning && G.countdown <= 0 && G.wave < 15) launchWave(false);
  if (!G.spawning && !G.paid && G.enemies.length === 0 && G.wave > 0) {
    G.paid = true; const b = 20 + 3 * G.wave; G.gold += b; goldUp();
    G.texts.push({ x: 640, y: 80, txt: SF_('clearPlus', b), color: '#ffd25a', size: 22, t: 0, life: 1.4, vy: -20 }); sfx('coin');
  }

  updTowers(dt); updEnemies(dt); updBullets(dt);

  for (const p of G.parts) { p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const t of G.texts) { t.t += dt; t.y += t.vy * dt; }
  G.texts = G.texts.filter(t => t.t < t.life);
  for (const f of G.fx) f.t += dt; G.fx = G.fx.filter(f => f.t < f.life);
  for (const b of G.bolts) b.t += dt; G.bolts = G.bolts.filter(b => b.t < b.life);
  for (const s of G.scorches) s.t += dt; G.scorches = G.scorches.filter(s => s.t < s.life);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - 26 * dt);

  if (G.state === 'play' && G.wave >= 15 && !G.spawning && G.enemies.length === 0) endGame(true);
}

function endGame(win) {
  G.state = win ? 'win' : 'lose'; sfx(win ? 'win' : 'lose'); G.aim = false; showOverlay(win ? 'win' : 'lose');
}

/* ---------------- 绘制：背景 ---------------- */
function buildBg() {
  bg = document.createElement('canvas'); bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
  const b = bg.getContext('2d'); b.setTransform(DPR, 0, 0, DPR, 0, 0);
  let seed = 11; const rd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = b.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2f5a33'); g.addColorStop(1, '#264a2c');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  for (let i = 0; i < 2600; i++) {
    const x = rd() * W, y = rd() * H;
    b.fillStyle = rd() > .5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.09)'; b.fillRect(x, y, 2 + rd() * 3, 2 + rd() * 3);
  }
  for (let i = 0; i < 70; i++) {
    const x = rd() * W, y = rd() * H; b.fillStyle = 'rgba(95,150,75,.35)'; b.beginPath(); b.ellipse(x, y, 30 + rd() * 50, 14 + rd() * 26, rd() * 3, 0, TAU); b.fill();
  }
  // 路径
  const stroke = (w, c) => { b.strokeStyle = c; b.lineWidth = w; b.lineJoin = 'round'; b.lineCap = 'butt'; b.beginPath(); PATH.forEach((p, i) => i ? b.lineTo(p[0], p[1]) : b.moveTo(p[0], p[1])); b.stroke(); };
  stroke(76, 'rgba(0,0,0,.25)'); stroke(70, '#4d3b27'); stroke(60, '#a58559');
  stroke(46, '#b4946a');
  for (let i = 0; i < 1800; i++) {
    const d = rd() * TOTAL, p = posAt(d), o = (rd() - .5) * 56; const nx = -p.dy, ny = p.dx;
    b.fillStyle = rd() > .5 ? 'rgba(80,60,36,.35)' : 'rgba(230,210,170,.28)';
    b.beginPath(); b.arc(p.x + nx * o, p.y + ny * o, 0.8 + rd() * 2, 0, TAU); b.fill();
  }
  for (let d = 70; d < TOTAL - 60; d += 150) {
    const p = posAt(d), a = Math.atan2(p.dy, p.dx);
    b.save(); b.translate(p.x, p.y); b.rotate(a); b.fillStyle = 'rgba(70,50,28,.38)';
    b.beginPath(); b.moveTo(-8, -12); b.lineTo(6, 0); b.lineTo(-8, 12); b.lineTo(-3, 0); b.closePath(); b.fill(); b.restore();
  }
  // 装饰
  const nearPath = (x, y, m) => { for (let i = 0; i < PATH.length - 1; i++) { const A = PATH[i], B = PATH[i + 1]; const t = clamp(((x - A[0]) * (B[0] - A[0]) + (y - A[1]) * (B[1] - A[1])) / (SEGL[i] * SEGL[i]), 0, 1); if (Math.hypot(x - (A[0] + (B[0] - A[0]) * t), y - (A[1] + (B[1] - A[1]) * t)) < m) return true; } return false; };
  const nearPad = (x, y, m) => PADS.some(p => Math.hypot(p.x - x, p.y - y) < m);
  for (let i = 0, n = 0; i < 400 && n < 46; i++) {
    const x = 20 + rd() * (W - 40), y = 20 + rd() * (H - 40);
    if (nearPath(x, y, 62) || nearPad(x, y, 46) || (x < 190 && y > 570)) continue;
    n++;
    const k = rd();
    if (k < 0.45) { // 树
      b.fillStyle = 'rgba(0,0,0,.25)'; b.beginPath(); b.ellipse(x + 4, y + 16, 20, 8, 0, 0, TAU); b.fill();
      b.fillStyle = '#5a3d22'; b.fillRect(x - 3, y + 2, 6, 14);
      for (const [dx, dy, r, c] of [[0, -6, 17, '#2a7a3a'], [-9, 2, 12, '#2f8a40'], [9, 2, 12, '#33914a'], [0, -14, 11, '#3aa352']]) { b.fillStyle = c; b.beginPath(); b.arc(x + dx, y + dy, r, 0, TAU); b.fill(); }
    } else if (k < 0.75) { // 石头
      b.fillStyle = 'rgba(0,0,0,.22)'; b.beginPath(); b.ellipse(x + 2, y + 8, 14, 5, 0, 0, TAU); b.fill();
      b.fillStyle = '#7d8590'; b.beginPath(); b.ellipse(x, y, 13, 9, 0, 0, TAU); b.fill(); b.fillStyle = '#a0a8b2'; b.beginPath(); b.ellipse(x - 3, y - 3, 7, 4, 0, 0, TAU); b.fill();
    } else { // 花
      for (let j = 0; j < 4; j++) { const fx = x + (rd() - .5) * 20, fy = y + (rd() - .5) * 14; b.fillStyle = ['#ffd25a', '#ff8fb0', '#ffffff', '#9fd0ff'][j]; b.beginPath(); b.arc(fx, fy, 2.4, 0, TAU); b.fill(); b.fillStyle = '#ffb02a'; b.beginPath(); b.arc(fx, fy, 0.9, 0, TAU); b.fill(); }
    }
  }
  // 暗角
  const vg = b.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 820); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.42)');
  b.fillStyle = vg; b.fillRect(0, 0, W, H);
}

/* ---------------- 绘制：防御塔 ---------------- */
function drawBase(x, y, lvl, scale) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
  E(2, 6, 28, 12, 'rgba(0,0,0,.35)');

/* ---------------- 输入 ---------------- */
function toLogical(e) { const rc = cv.getBoundingClientRect(); return { x: (e.clientX - rc.left) * W / rc.width, y: (e.clientY - rc.top) * H / rc.height }; }
function padAt(m) { return PADS.find(p => Math.hypot(p.x - m.x, p.y - m.y) <= 28) || null; }
function updateHover(m) {
  G.mouse = { x: m.x, y: m.y, in: true };
  G.hoverPad = padAt(m); G.hoverTower = G.hoverPad && G.hoverPad.tower;
  G.hoverOpt = -1;
  if (G.ring) for (let i = 0; i < 4; i++) { const b = ringBtn(i); if (Math.hypot(b.x - m.x, b.y - m.y) <= b.r + 3) G.hoverOpt = i; }
  cv.style.cursor = (G.aim || G.hoverPad || G.hoverOpt >= 0) ? 'pointer' : 'default';
}
cv.addEventListener('pointermove', e => updateHover(toLogical(e)));
cv.addEventListener('pointerleave', () => { G.mouse.in = false; G.hoverOpt = -1; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelAll(); });
cv.addEventListener('pointerdown', e => {
  audio();
  if (G.state !== 'play') return;
  const m = toLogical(e); updateHover(m);
  if (e.button === 2) { cancelAll(); return; }
  if (G.aim) { castMeteor(m); return; }
  if (G.ring) {
    if (G.hoverOpt >= 0) { build(G.ring, TKEYS[G.hoverOpt]); return; }
    const pd = padAt(m);
    if (pd === G.ring) { G.ring = null; return; }
    G.ring = null;
    if (!pd) { G.sel = null; refreshAll(); return; }
  }
  const pad = padAt(m);
  if (!pad) { G.sel = null; refreshAll(); return; }
  if (pad.tower) { G.sel = pad.tower; G.ring = null; sfx('hit'); }
  else { G.ring = pad; G.sel = null; }
  refreshAll();
});
function cancelAll() { G.ring = null; G.sel = null; G.aim = false; refreshAll(); }

function castMeteor(m) {
  const s = G.skills.meteor;
  G.aim = false;
  if (s.cd > 0) return;
  s.cd = s.max; sfx('meteor');
  for (let i = 0; i < 3; i++) G.meteors.push({ x: m.x + (i ? rnd(-55, 55) : 0), y: m.y + (i ? rnd(-45, 45) : 0), t: 0, delay: i * 0.55, T: 0.9, hit: false });
  refreshAll();
}
function skMeteor() {
  if (G.state !== 'play') return;
  if (G.skills.meteor.cd > 0) { sfx('bad'); return; }
  G.aim = !G.aim; G.ring = null; G.sel = null; refreshAll();
}
function skOver() {
  if (G.state !== 'play') return;
  const s = G.skills.over;
  if (s.cd > 0) { sfx('bad'); return; }
  s.cd = s.max; s.active = 6; sfx('over'); shake(3);
  G.banner = { txt: S_('bnOver'), t: 1.4, color: '#ffd25a' };
}
function earlyCall() {
  if (G.state !== 'play' || G.spawning || G.wave >= 15) return;
  launchWave(true);
}
function togglePause() {
  if (G.state === 'play') { G.state = 'pause'; showOverlay('pause'); }
  else if (G.state === 'pause') { G.state = 'play'; hideOverlay(); }
  $('btnPause').textContent = G.state === 'pause' ? S_('resumeBtn') : S_('pause');
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); togglePause(); return; }
  if (G.state !== 'play') { if (k === 'r' && (G.state === 'win' || G.state === 'lose')) startGame(); return; }
  if (k >= '1' && k <= '4' && G.ring) build(G.ring, TKEYS[+k - 1]);
  else if (k === 'u' && G.sel) upgrade(G.sel);
  else if (k === 'x' && G.sel) sell(G.sel);
  else if (k === 'q') skMeteor();
  else if (k === 'w') skOver();
  else if (k === 'n') earlyCall();
  else if (k === 'escape') cancelAll();
  else if (k === 'm') toggleMute();
});

// 背景音乐：战斗中循环，Boss 或大军压境时切到紧张曲目
let tenseBgm = false, lastBgm = '';

    want = tenseBgm ? 'td-tense' : 'td-calm';

  if (want !== lastBgm && AC) { lastBgm = want; if (want) AMG_BGM.play(want); else AMG_BGM.stop(); }
}

function refreshPanel() {
  const tw = G.sel;
  $('pIdle').hidden = !!tw; $('pTower').hidden = !tw;
  if (!tw) return;
  const d = TD[tw.type];
  $('tIcon').textContent = d.icon; $('tName').textContent = d.name; $('tLv').textContent = 'Lv.' + (tw.lvl + 1) + (tw.lvl === 2 ? S_('awaken') : '');
  const cur = statLines(tw.type, tw.lvl), nx = tw.lvl < 2 ? statLines(tw.type, tw.lvl + 1) : null;
  $('tStats').innerHTML = cur.map((r, i) => {
    const n = nx && nx[i] && String(nx[i][1]) !== String(r[1]) ? `<span class="nx"> → ${nx[i][1]}</span>` : '';
    return `<div><span>${r[0]}</span><span>${r[1]}${n}</span></div>`;
  }).join('') + (tw.type === 'arrow' && tw.lvl === 2 ? `<div><span>${S_('sl_streak')}</span><span id="tStreak">+${tw.streak * 15}%</span></div>` : '');
  document.querySelectorAll('#prio button').forEach(b => b.classList.toggle('on', b.dataset.m === tw.mode));
  $('tDesc').textContent = d.desc;
  refreshPanelDyn();
}
function refreshPanelDyn() {
  const tw = G.sel; if (!tw) return;
  $('tDmg').textContent = Math.round(tw.dmg).toLocaleString(); $('tKills').textContent = tw.kills;
  const c = upCost(tw);
  $('btnUp').textContent = c == null ? S_('maxed') : SF_('upTo', tw.lvl + 2, c);
  $('btnUp').disabled = c == null || G.gold < c;
  $('btnSell').textContent = SF_('sellBtn', sellValue(tw));
  const st = document.getElementById('tStreak'); if (st) st.textContent = '+' + tw.streak * 15 + '%';
}
function refreshAll() { refreshHud(); refreshPanel(); }
let lastUi = 0, lastEarly = '';
function updateUi() {
  const now = performance.now();
  if (now - lastUi < 120) return; lastUi = now;
  $('vGold').textContent = Math.floor(G.gold);
  $('vLives').textContent = G.lives;
  refreshPanelDyn();
  const sk = G.skills;
  for (const [id, s, act] of [['skMeteor', sk.meteor, G.aim], ['skOver', sk.over, sk.over.active > 0]]) {
    const el = $(id);
    el.querySelector('.cdm').style.height = (s.cd > 0 ? (s.cd / s.max * 100) : 0) + '%';
    el.querySelector('.cdt').textContent = s.cd > 0 ? Math.ceil(s.cd) : (id === 'skOver' && s.active > 0 ? Math.ceil(s.active) : '');
    el.classList.toggle('rdy', s.cd <= 0 && !act); el.classList.toggle('aim', id === 'skMeteor' && act); el.classList.toggle('act2', id === 'skOver' && act);
  }
  const be = $('btnEarly'); let txt, dis = false, pulse = false;
  if (G.wave >= 15) { txt = S_('eFinal'); dis = true; }
  else if (G.spawning) { txt = SF_('eAttack', G.wave); dis = true; }
  else if (G.countdown > 0) { txt = SF_('eEarly', G.wave + 1, Math.round(G.countdown * 1.5), Math.ceil(G.countdown)); }
  else { txt = SF_('eStart', G.wave + 1); pulse = true; }
  if (txt !== lastEarly) { be.textContent = txt; lastEarly = txt; }
  be.disabled = dis || G.state !== 'play'; be.classList.toggle('pulse', pulse && G.state === 'play');
}

/* ---------------- 覆盖层 ---------------- */
let ovKind = 'ready';
function showOverlay(kind) {
  ovKind = kind;
  const ov = $('ov'); let h = ''; ov.className = 'screen dim';
  if (kind === 'ready') {
    ov.className = 'screen';
    h = `<div class="title-badge">${S_('readyBadge')}</div>
      <h2 class="game-title">${S_('readyTitle')}</h2>
      <div class="hero-row"><span class="hero">🏹</span><span class="hero f">💎</span><span class="hero">👹</span></div>
      <button class="btn primary" id="o-start">${S_('startBtn')}</button>
      <p class="hint">${S_('readyBody')}<br>${S_('readyKeys')}<br><span class="tip-s">${S_('readyTip')}</span></p>`;
  } else if (kind === 'pause') h = `<div class="panel"><h3>${S_('paused')}</h3><p>${S_('pausedSub')}</p><div class="row"><button class="btn primary" id="o-resume">${S_('resume')}</button><button class="btn ghost" id="o-restart">${S_('restart')}</button></div></div>`;
  else if (kind === 'win') {
    const st = G.lives >= 18 ? 3 : G.lives >= 10 ? 2 : 1;
    h = `<div class="panel pop"><h3 class="clear-title">${S_('winTitle')}</h3><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</div><p>${SF_('winStat', G.lives, G.kills, G.towers.length)}</p><div class="row"><button class="btn primary" id="o-restart">${S_('again')}</button></div></div>`;
  } else if (kind === 'lose') h = `<div class="panel pop"><h3 class="over-title">${S_('loseTitle')}</h3><p>${SF_('loseStat', G.wave, G.kills)}</p><div class="row"><button class="btn primary" id="o-restart">${S_('restart')}</button></div></div>`;
  ov.innerHTML = h; ov.classList.remove('hidden');
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = () => { audio(); fn(); }; };
  on('o-start', startGame); on('o-resume', togglePause); on('o-restart', startGame);
}
function hideOverlay() { $('ov').classList.add('hidden'); ovKind = ''; }
function startGame() {
  const sp = G.speed, auto = G.autoNext; newGame(); G.speed = sp; G.autoNext = auto; G.state = 'play';
  $('btnPause').textContent = S_('pause'); hideOverlay();
  setNextWave(0);
  G.banner = { txt: S_('bnStart'), t: 3, color: '#ffd25a' };
  refreshAll();
}

/* ---------------- 主循环 ---------------- */
let lastTs = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const rd = Math.min(0.1, (ts - lastTs) / 1000 || 0); lastTs = ts;
  if (G.state === 'play') {
    acc += rd * G.speed; let n = 0;
    while (acc >= STEP && n < 12) { step(STEP); acc -= STEP; n++; if (G.state !== 'play') break; }
    if (n >= 12) acc = 0;
  } else if (G.state !== 'pause') G.time += rd;
  updateBgm(); render(); updateUi();
}
function fit() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.round(W * DPR); if (cv.width !== pw) { cv.width = pw; cv.height = Math.round(H * DPR); buildBg(); }
}
window.addEventListener('resize', fit);
const muteBtn = $('btnMute');
window.__refreshLang = () => {
  AMG.apply(GAME_STR);
  muteBtn.title = S_('muteTitle'); $('btnAuto').title = S_('autoTitle'); $('btnPause').title = S_('pauseTitle');
  setNextWave(nwWave); lastEarly = ''; refreshAll(); updateUi();
  if (ovKind) showOverlay(ovKind);
};
window.__td = { get G() { return G; }, startGame, build, upgrade, sell, step, PADS, launchWave };

DPR = Math.min(window.devicePixelRatio || 1, 2);
newGame(); fit(); buildBg(); AMG.mountBtn(); window.__refreshLang(); showOverlay('ready');
setNextWave(0);
requestAnimationFrame(frame);
})();
</script>
</body>
