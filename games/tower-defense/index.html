<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<main class="page">
  <header class="brand">
    <div class="logo">💎</div>
    <div>
      <h1><span data-i18n="gameTitle">水晶守卫</span> <em data-i18n="subtitle">策略塔防</em></h1>
      <p data-i18n="intro">布置防御塔，守住水晶，挡住 15 波敌人与 3 场 Boss 战！</p>
    </div>
    <div class="brand-btns">
      <input type="range" id="vol" class="vol" min="0" max="100" step="5" aria-label="Volume" title="Volume">
      <button id="btnMute" class="icon-btn" title="声音开 / 关 (M)">🔊</button>
    </div>
  </header>
  <section class="cabinet">
    <div class="td-main">
      <div class="hud" id="top">
        <div class="chip" id="gold">💰 <span id="vGold">0</span></div>
        <div class="chip" id="lives">❤️ <span id="vLives">20</span></div>
        <div class="chip">🌊 <span id="vWave">0</span><small>/ 15</small></div>
        <div class="sp"></div>
        <div class="seg" id="speedSeg"><button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="3">3x</button></div>
        <button class="tb" id="btnAuto">自动下一波：关</button>
        <button class="tb" id="btnPause">⏸ 暂停</button>
      </div>
      <div class="game-frame">
        <canvas id="c" width="1280" height="720"></canvas>
        <div id="ov" class="screen"></div>
      </div>
      <div class="skillbar" id="bottom">
        <button class="skill" id="skMeteor"><span class="ico">☄️</span><span><span data-i18n="skMeteor">天基陨石</span> <kbd style="font-size:11px">Q</kbd><small data-i18n="skMeteorSub">3 连轰 · 范围巨伤 + 眩晕</small></span><i class="cdm"></i><em class="cdt"></em></button>
        <button class="skill" id="skOver"><span class="ico">⚡</span><span><span data-i18n="skOver">超频增幅</span> <kbd style="font-size:11px">W</kbd><small data-i18n="skOverSub">全塔攻速 +50% · 6 秒</small></span><i class="cdm"></i><em class="cdt"></em></button>
        <button id="btnEarly">⚔ 提前迎战</button>
      </div>
    </div>
    <aside class="side">
      <div class="card" id="panel">
        <div id="pIdle">
          <h4 style="margin-top:0;font-size:15px;color:var(--ui-text)" data-i18n="intelTitle">📡 战场情报</h4>
          <div id="nextWave"></div>
          <h4 data-i18n="enemyTitle">敌人图鉴</h4>
          <div class="enl"><i>👺</i><div><b data-i18n="en_goblin">哥布林步兵</b><span data-i18n="ed_goblin">属性均衡的基础炮灰</span></div></div>
          <div class="enl"><i>🐺</i><div><b data-i18n="en_hound">疾风猎犬</b><span data-i18n="ed_hound"></span></div></div>
          <div class="enl"><i>🛡️</i><div><b data-i18n="en_guard">重甲铁卫</b><span data-i18n="ed_guard"></span></div></div>
          <div class="enl"><i>🧙</i><div><b data-i18n="en_shaman">暗影萨满</b><span data-i18n="ed_shaman"></span></div></div>
          <div class="enl"><i>🟢</i><div><b data-i18n="en_slime">分裂史莱姆</b><span data-i18n="ed_slime"></span></div></div>
          <div class="enl"><i>👹</i><div><b data-i18n="en_boss">深渊攻城巨兽</b><span data-i18n="ed_boss"></span></div></div>
        </div>
        <div id="pTower" hidden>
          <div class="tname"><span id="tIcon"></span><b id="tName"></b><span class="lv" id="tLv"></span></div>
          <div class="tstats" id="tStats"></div>
          <div class="tstats"><div><span data-i18n="totalDmg">累计伤害</span><b id="tDmg">0</b></div><div><span data-i18n="kills">击杀数</span><b id="tKills">0</b></div></div>
          <h4 style="margin-top:6px" data-i18n="prioTitle">索敌优先级</h4>
          <div class="prio" id="prio">
            <button data-m="first" data-i18n="m_first"></button><button data-m="strong" data-i18n="m_strong"></button>
            <button data-m="weak" data-i18n="m_weak"></button><button data-m="close" data-i18n="m_close"></button>
          </div>
          <button class="act" id="btnUp"></button>
          <button class="act sell" id="btnSell"></button>
          <p id="tDesc"></p>
        </div>
      </div>
      <div class="card"><h4 data-i18n="opTitle">🎮 操作</h4><ul>
        <li data-i18n="op1"></li><li data-i18n="op2"></li>
        <li><kbd>1</kbd>–<kbd>4</kbd> <span data-i18n="op3a"></span> · <kbd>U</kbd> <span data-i18n="op3b"></span> · <kbd>X</kbd> <span data-i18n="op3c"></span></li>
        <li><kbd>Q</kbd> <span data-i18n="op4a"></span> · <kbd>W</kbd> <span data-i18n="op4b"></span> · <kbd>N</kbd> <span data-i18n="op4c"></span></li>
        <li><kbd>Space</kbd> <span data-i18n="op5a"></span> · <kbd>Esc</kbd> <span data-i18n="op5b"></span> · <kbd>M</kbd> <span data-i18n="op5c"></span></li></ul></div>
      <div class="card diff"><h4 data-i18n="tipTitle">💡 通关秘籍</h4><p data-i18n="tipBody"></p></div>
    </aside>
  </section>
  <details class="card seo-about"><summary data-i18n="aboutTitle">📖 关于这款游戏</summary><p data-i18n="aboutBody"></p></details>
  <footer data-i18n="footer">🕹️ 打开即玩 · 完全免费 · 支持键盘和触屏</footer>
</main>
