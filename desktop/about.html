<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 Awesome Mini Game</title>
<link rel="stylesheet" href="../assets/ui.css">
<script src="../assets/theme.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--ui-bg) !important; color: var(--ui-text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 36px 28px 28px; line-height: 1.7; text-align: center;
  }
  .logo { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 8px 30px rgba(208,128,57,.35); }
  h1 { font-size: 22px; margin: 16px 0 2px; letter-spacing: 1px;
    font-family: "AMG Display", "PingFang SC", system-ui, sans-serif; font-weight: 400; }
  .ver { color: var(--ui-primary); font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  .desc { color: var(--ui-muted-text); font-size: 13.5px; margin: 14px 0 4px; max-width: 380px; }
  .games { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0; max-width: 400px; }
  .games span { font-size: 12px; color: var(--ui-chip-text); background: var(--ui-chip);
    padding: 3px 11px; border-radius: 999px; }
  .tech { font-size: 12.5px; color: var(--ui-muted-text); margin-top: 6px; }
  .btns { display: flex; gap: 10px; margin-top: 20px; }
  .btn { font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px 22px;
    border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: .2s; }
  .btn-primary { background: var(--ui-primary); color: var(--ui-primary-fg);
    box-shadow: 0 4px 0 var(--ui-primary-edge); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ui-primary-edge); }
  .btn-ghost { background: var(--ui-primary-soft); color: var(--ui-primary); text-decoration: none; }
  .btn-ghost:hover { filter: brightness(1.03); }
  .foot { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--ui-muted-text); }
  .foot a { color: var(--ui-primary); text-decoration: none; }
</style>
</head>
<body>
  <img class="logo" src="../favicon.svg" alt="Awesome Mini Game">
  <h1>Awesome Mini Game</h1>
  <div class="ver" id="ver">v…</div>
  <p class="desc">14 款纯原生 JS 经典小游戏合集 —— 俄罗斯方块、雷电、坦克大战、马里奥、中国象棋、斗地主……离线可玩，开箱即玩。</p>
  <div class="games">
    <span>🚀 雷电</span><span>🍄 马里奥</span><span>🪖 坦克大战</span><span>🐝 小蜜蜂</span>
    <span>♞ 象棋</span><span>🃏 斗地主</span><span>⚫ 五子棋</span><span>🧱 方块</span>
    <span>🔢 2048</span><span>💣 扫雷</span><span>🎯 打砖块</span><span>🫧 泡泡龙</span>
    <span>💎 消消乐</span><span>🐤 Flappy</span>
  </div>
  <p class="tech">Canvas 2D · WebAudio 合成音效 · localStorage 存档 · Tauri 桌面壳</p>
  <div class="btns" id="tauriBtns" style="display:none">
    <button class="btn btn-primary" id="checkUpdate">检查更新</button>
    <a class="btn btn-ghost" href="https://github.com/davidzhanghui/awesome-mini-game">GitHub 仓库</a>
  </div>
  <p class="foot">MIT License · 经典重制仅供学习交流 · <a href="https://github.com/davidzhanghui/awesome-mini-game">github.com/davidzhanghui/awesome-mini-game</a></p>
<script>
(function () {
  var tauri = window.__TAURI__;
  if (!tauri || !tauri.core) { document.getElementById('ver').textContent = '网页版'; return; }
  document.getElementById('tauriBtns').style.display = 'flex';
  tauri.core.invoke('get_app_version').then(function (v) {
    document.getElementById('ver').textContent = 'v' + v + ' · macOS 桌面版';
  }).catch(function () {
    document.getElementById('ver').textContent = 'macOS 桌面版';
  });
  document.getElementById('checkUpdate').addEventListener('click', function () {
    tauri.core.invoke('check_for_updates_now');
  });
})();
</script>
</body>
</html>
