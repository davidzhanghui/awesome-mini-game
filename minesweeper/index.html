<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="/favicon.svg" />
<title>扫雷 · 经典益智</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<main class="page">
  <header class="brand">
    <div class="logo">💣</div>
    <div>
      <h1>扫雷 <em>经典益智</em></h1>
      <p>初级 / 中级 / 高级 · 首击安全 · 双击展开</p>
    </div>
    <div class="brand-btns">
      <button id="btn-mute" class="icon-btn" title="声音开 / 关 (M)">🔊</button>
    </div>
  </header>
  <section class="cabinet">
    <div class="game-frame">
      <canvas id="game" width="520" height="620"></canvas>
      <div id="screen-menu" class="screen">
        <div class="title-badge">MINESWEEPER</div>
        <h2 class="game-title">扫雷</h2>
        <div class="hero-row"><span class="hero">💣</span><span class="hero f">🚩</span><span class="hero">🔢</span></div>
        <div class="mode-grid">
          <button class="btn primary" data-mode="0">🌱 初级 9×9·10</button>
          <button class="btn duel" data-mode="1">🌿 中级 16×16·40</button>
          <button class="btn duel" data-mode="2">🌳 高级 30×16·99</button>
        </div>
        <div id="menu-best" class="mini-board">🏆 最佳：初 -- · 中 -- · 高 --</div>
      </div>
      <div id="screen-over" class="screen dim hidden">
        <div class="panel pop">
          <h3 id="over-title" class="over-title">💥 踩到地雷！</h3>
          <div id="over-sub" class="over-sub"></div>
          <div class="row"><button id="btn-retry" class="btn primary">🔄 再来一局 (R)</button><button id="btn-menu" class="btn ghost">菜单</button></div>
        </div>
      </div>
    </div>
    <aside class="side">
      <div class="card"><h4>🎮 操作</h4><ul>
        <li>左键揭开 · 右键标旗（触屏长按标旗）</li><li>双击数字：旗数够则展开周围</li><li><kbd>R</kbd> 重开 · <kbd>P</kbd>/<kbd>Esc</kbd> 暂停 · <kbd>M</kbd> 静音</li></ul></div>
      <div class="card"><h4>📏 规则</h4><ul>
        <li>首次点击必定安全</li><li>数字 = 周围 8 格地雷数</li><li>全部安全格揭开即胜利</li></ul></div>
    </aside>
  </section>
  <footer>Canvas + WebAudio 原生实现 · 零依赖 · 经典三档 + 首击保护</footer>
</main>
<script src="game.js?v=20260906"></script>
</body>
</html>
