<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="/favicon.svg" />
<title>中国象棋 · 经典桌游</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<main class="page">
  <header class="brand">
    <div class="logo">♞</div>
    <div>
      <h1><span data-i18n="gameTitle">中国象棋</span> <em data-i18n="subtitle">经典桌游</em></h1>
      <p data-i18n="intro">完整规则 · 本地双人 / 三档 AI · Web Worker 极速思考</p>
    </div>
    <div class="brand-btns">
      <button id="btn-flip" class="icon-btn" title="翻转棋盘">🔄</button>
      <button id="btn-mute" class="icon-btn" title="声音开 / 关 (M)">🔊</button>
    </div>
  </header>
  <section class="cabinet">
    <div class="game-frame">
      <canvas id="game" width="560" height="640"></canvas>
      <div id="hud" class="hud hidden">
        <span id="hud-turn">🔴 红方行棋</span>
        <span id="hud-info">第 1 手</span>
      </div>
      <div id="screen-menu" class="screen">
        <div class="title-badge">XIANGQI</div>
        <h2 class="game-title" data-i18n="gameTitle">中国象棋</h2>
        <div class="board-emoji">♜♞♝♛♚♝♞♜</div>
        <div class="mode-grid">
          <button class="btn primary" data-mode="pvp" data-i18n="modePvp">👥 双人对战</button>
          <button class="btn duel" data-mode="ai0" data-i18n="modeAi0">🤖 AI 简单</button>
          <button class="btn duel" data-mode="ai1" data-i18n="modeAi1">🧠 AI 普通</button>
          <button class="btn duel" data-mode="ai2" data-i18n="modeAi2">👹 AI 困难</button>
        </div>
        <div class="opt-row">
          <label><span data-i18n="mySide">我方</span> <select id="sel-color"><option value="1" data-i18n="redFirst">🔴 执红先行</option><option value="-1" data-i18n="blkFirst">⚫ 执黑后行</option></select></label>
          <label><input type="checkbox" id="ck-hint" checked /> <span data-i18n="showHint">显示可走位置</span></label>
        </div>
        <div class="mini-board">🏆 <span data-i18n="stRed">红胜</span> <b id="st-r">0</b> · <span data-i18n="stBlk">黑胜</span> <b id="st-b">0</b> · <span data-i18n="stDraw">和</span> <b id="st-d">0</b></div>
      </div>
      <div id="screen-over" class="screen dim hidden">
        <div class="panel pop">
          <h3 id="over-title" class="over-title">🔴 红方获胜！</h3>
          <div id="over-sub" class="over-sub"></div>
          <div class="row">
            <button id="btn-retry" class="btn primary" data-i18n="retry">🔄 再来一局 (R)</button>
            <button id="btn-menu" class="btn ghost" data-i18n="menu">菜单</button>
          </div>
        </div>
      </div>
      <div class="toolbar hidden" id="toolbar">
        <button id="btn-undo" class="t-btn" data-i18n="undo">↩ 悔棋 (U)</button>
        <button id="btn-resign" class="t-btn" data-i18n="resignBtn">🏳 认输</button>
        <button id="btn-tomenu" class="t-btn" data-i18n="toMenu">📋 菜单</button>
      </div>
    </div>
    <aside class="side">
      <div class="card"><h4 data-i18n="opTitle">🎮 操作</h4><ul>
        <li data-i18n="op1">点击己方棋子选中，再点目标走子</li><li><kbd>U</kbd> <span data-i18n="opU">悔棋</span> · <kbd>R</kbd> <span data-i18n="opR">重开</span> · <kbd>M</kbd> <span data-i18n="opM">静音</span></li></ul></div>
      <div class="card"><h4 data-i18n="ruleTitle">📏 规则要点</h4><ul>
        <li data-i18n="rule1">马腿象眼别住即不可走</li><li data-i18n="rule2">将帅不见面，飞将可吃</li><li data-i18n="rule3">困毙判负 · 三次重复局面判和</li></ul></div>
    </aside>
  </section>
  <footer data-i18n="footer">Canvas + WebAudio 原生实现 · 零依赖 · Negamax α-β + Web Worker</footer>
</main>
<script src="ai-worker.js?v=20260906"></script>
