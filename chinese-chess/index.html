<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" href="/favicon.svg" />
<title>中国象棋 · 经典桌游</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<main class="page">
  <header class="brand">
    <div class="logo">♞</div>
    <div>
      <h1>中国象棋 <em>经典桌游</em></h1>
      <p>完整规则 · 本地双人 / 三档 AI · Web Worker 极速思考</p>
    </div>
    <div class="brand-btns">
      <button id="btn-flip" class="icon-btn" title="翻转棋盘">🔄</button>
      <button id="btn-mute" class="icon-btn" title="声音开 / 关 (M)">🔊</button>
    </div>
  </header>
  <section class="cabinet">
    <div class="game-frame">
      <canvas id="game" width="560" height="640"></canvas>
      <div id="hud" class="hud hidden">
        <span id="hud-turn">🔴 红方行棋</span>
        <span id="hud-info">第 1 手</span>
      </div>
      <div id="screen-menu" class="screen">
        <div class="title-badge">XIANGQI</div>
        <h2 class="game-title">中国象棋</h2>
        <div class="board-emoji">♜♞♝♛♚♝♞♜</div>
        <div class="mode-grid">
          <button class="btn primary" data-mode="pvp">👥 双人对战</button>
          <button class="btn duel" data-mode="ai0">🤖 AI 简单</button>
          <button class="btn duel" data-mode="ai1">🧠 AI 普通</button>
          <button class="btn duel" data-mode="ai2">👹 AI 困难</button>
        </div>
        <div class="opt-row">
          <label>我方 <select id="sel-color"><option value="1">🔴 执红先行</option><option value="-1">⚫ 执黑后行</option></select></label>
          <label><input type="checkbox" id="ck-hint" checked /> 显示可走位置</label>
        </div>
        <div class="mini-board">🏆 红胜 <b id="st-r">0</b> · 黑胜 <b id="st-b">0</b> · 和 <b id="st-d">0</b></div>
      </div>
      <div id="screen-over" class="screen dim hidden">
        <div class="panel pop">
          <h3 id="over-title" class="over-title">🔴 红方获胜！</h3>
          <div id="over-sub" class="over-sub"></div>
          <div class="row">
            <button id="btn-retry" class="btn primary">🔄 再来一局 (R)</button>
            <button id="btn-menu" class="btn ghost">菜单</button>
          </div>
        </div>
      </div>
      <div class="toolbar hidden" id="toolbar">
        <button id="btn-undo" class="t-btn">↩ 悔棋 (U)</button>
        <button id="btn-resign" class="t-btn">🏳 认输</button>
        <button id="btn-tomenu" class="t-btn">📋 菜单</button>
      </div>
    </div>
    <aside class="side">
      <div class="card"><h4>🎮 操作</h4><ul>
        <li>点击己方棋子选中，再点目标走子</li><li><kbd>U</kbd> 悔棋 · <kbd>R</kbd> 重开 · <kbd>M</kbd> 静音</li></ul></div>
      <div class="card"><h4>📏 规则要点</h4><ul>
        <li>马腿象眼别住即不可走</li><li>将帅不见面，飞将可吃</li><li>困毙判负 · 三次重复局面判和</li></ul></div>
    </aside>
  </section>
  <footer>Canvas + WebAudio 原生实现 · 零依赖 · Negamax α-β + Web Worker</footer>
</main>
<script src="ai-worker.js?v=20260906"></script>
<script src="game.js?v=20260906"></script>
</body>
</html>
