<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" href="/favicon.svg" />
<title>五子棋 · 经典桌游</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<main class="page">
  <header class="brand">
    <div class="logo">⚫</div>
    <div>
      <h1><span data-i18n="name">五子棋</span> <em data-i18n="subtitle">经典桌游</em></h1>
      <p data-i18n="intro">本地双人 / 三档 AI · 悔棋认输 · 可选黑棋禁手</p>
    </div>
    <div class="brand-btns">
      <button id="btn-mute" class="icon-btn" title="声音开 / 关 (M)">🔊</button>
    </div>
  </header>
  <section class="cabinet">
    <div class="game-frame">
      <canvas id="game" width="600" height="600"></canvas>
      <div id="hud" class="hud hidden">
        <span id="hud-turn" class="turn black">⚫ 黑方行棋</span>
        <span id="hud-moves">第 0 手</span>
      </div>
      <div id="screen-menu" class="screen">
        <div class="title-badge">GOMOKU</div>
        <h2 class="game-title" data-i18n="name">五子棋</h2>
        <div class="mode-grid">
          <button class="btn primary" data-mode="pvp" data-i18n="modePvp">👥 双人对战</button>
          <button class="btn duel" data-mode="ai0" data-i18n="modeAi0">🤖 AI 简单</button>
          <button class="btn duel" data-mode="ai1" data-i18n="modeAi1">🧠 AI 普通</button>
          <button class="btn duel" data-mode="ai2" data-i18n="modeAi2">👹 AI 困难</button>
        </div>
        <div class="opt-row">
          <label><span data-i18n="me">我方</span> <select id="sel-color"><option value="1" data-i18n="optBlack">⚫ 执黑先行</option><option value="2" data-i18n="optWhite">⚪ 执白后行</option></select></label>
          <label><input type="checkbox" id="ck-forbid" /> <span data-i18n="forbidLabel">黑棋禁手（三三/四四/长连）</span></label>
        </div>
        <div class="mini-board"><span data-i18n="stB">🏆 黑胜</span> <b id="st-b">0</b> · <span data-i18n="stW">白胜</span> <b id="st-w">0</b> · <span data-i18n="stD">和</span> <b id="st-d">0</b></div>
      </div>
      <div id="screen-over" class="screen dim hidden">
        <div class="panel pop">
          <h3 id="over-title" class="over-title">⚫ 黑方获胜！</h3>
          <div id="over-sub" class="over-sub">共 37 手</div>
          <div class="row">
            <button id="btn-retry" class="btn primary" data-i18n="retry">🔄 再来一局 (R)</button>
            <button id="btn-menu" class="btn ghost" data-i18n="menu">菜单</button>
          </div>
        </div>
      </div>
      <div class="toolbar hidden" id="toolbar">
        <button id="btn-undo" class="t-btn" title="悔棋 (U)" data-i18n="undo">↩ 悔棋</button>
        <button id="btn-resign" class="t-btn" title="认输" data-i18n="resign">🏳 认输</button>
        <button id="btn-tomenu" class="t-btn" title="回菜单" data-i18n="tomenu">📋 菜单</button>
      </div>
    </div>
    <aside class="side">
      <div class="card"><h4 data-i18n="opTitle">🎮 操作</h4><ul>
        <li data-i18n="op1">点击棋盘交叉点落子</li><li><kbd>U</kbd> <span data-i18n="undoKw">悔棋</span> · <kbd>R</kbd> <span data-i18n="rematchKw">重开</span> · <kbd>M</kbd> <span data-i18n="muteKw">静音</span></li>
        <li data-i18n="op3">AI 对局中轮到你时再落子</li></ul></div>
      <div class="card"><h4 data-i18n="ruleTitle">📏 规则</h4><ul>
        <li data-i18n="rule1">黑先白后，横竖斜连成五即胜</li>
        <li data-i18n="rule2">禁手仅判黑方，白方无禁手</li>
        <li data-i18n="rule3">棋盘下满且无人连五则和棋</li></ul></div>
    </aside>
  </section>
  <footer data-i18n="footer">Canvas + WebAudio 原生实现 · 零依赖 · AI 搜索：启发式 + Negamax α-β</footer>
</main>
