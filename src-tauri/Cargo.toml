[package]
name = "awesome-mini-game"
version = "0.1.5"
edition = "2021"
rust-version = "1.77.2"
description = "Awesome Mini Game macOS 桌面版 (Tauri v2)"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
